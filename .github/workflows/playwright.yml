name: Run Playwright Tests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    permissions:
      contents: write
    timeout-minutes: 30
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      BASE_URL: ${{ secrets.BASE_URL_DEV }}
      USER: ${{ secrets.USER_DEV }}
      PASSWORD: ${{ secrets.PASSWORD_DEV }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env.dev
        run:
          echo BASE_URL=$BASE_URL > .env.dev
          echo USER=$USER >> .env.dev
          echo PASSWORD=$PASSWORD >> .env.dev

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Test Environment
        run: docker compose build --pull

      - name: Execute Playwright UI Tests
        run: docker compose run --rm tests

      - name: Generate Allure Test Report
        run: docker compose run --rm report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30